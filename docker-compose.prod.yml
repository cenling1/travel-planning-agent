services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  backend:
    build: .
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head &&
      uvicorn backend.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      UPLOAD_DIR: /data/uploads
      MCP_CONFIG_PATH: /run/secrets/servers_config.json
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_CHAT_MODEL: ${DEEPSEEK_CHAT_MODEL:-deepseek-v4-pro}
      DEEPSEEK_REASONING_MODEL: ${DEEPSEEK_REASONING_MODEL:-deepseek-v4-pro}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_TEMPERATURE: ${DEEPSEEK_TEMPERATURE:-0.7}
      DEEPSEEK_THINKING_ENABLED: ${DEEPSEEK_THINKING_ENABLED:-false}
      LLM_EXTRACTION_TIMEOUT_SECONDS: ${LLM_EXTRACTION_TIMEOUT_SECONDS:-12}
      LLM_GENERATION_TIMEOUT_SECONDS: ${LLM_GENERATION_TIMEOUT_SECONDS:-75}
      RAG_TIMEOUT_SECONDS: ${RAG_TIMEOUT_SECONDS:-12}
      MCP_TIMEOUT_SECONDS: ${MCP_TIMEOUT_SECONDS:-30}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      AUTH_REGISTRATION_ENABLED: ${AUTH_REGISTRATION_ENABLED:-false}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-travel-planning-agent}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-travel-planning-agent-web}
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-15}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      MAX_INFLIGHT_REQUESTS: ${MAX_INFLIGHT_REQUESTS:-8}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-20971520}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    volumes:
      - uploads_data:/data/uploads
      - ${MCP_CONFIG_HOST_PATH:?set MCP_CONFIG_HOST_PATH}:/run/secrets/servers_config.json:ro
    expose:
      - "8000"
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  # Vue 3 + Nginx public entrypoint
  web:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
      args:
        NGINX_CONFIG: nginx/production.conf
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${TLS_CERT_HOST_PATH:?set TLS_CERT_HOST_PATH}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_KEY_HOST_PATH:?set TLS_KEY_HOST_PATH}:/etc/nginx/tls/privkey.pem:ro
    logging:
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres_data:
  uploads_data:
